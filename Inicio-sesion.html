<!DOCTYPE html>
<html lang="es">

<head>

   <meta charset="UTF-8">

   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title>Lencería | Iniciar sesión</title>


   <!-- FUENTES -->

   <link rel="preconnect" href="https://fonts.googleapis.com">

   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet">


   <!-- ICONOS -->

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


   <!-- CSS -->

   <link rel="stylesheet" href="Inicio-sesion.css">

</head>


<body>


   <main class="container">


      <div class="login-card">


         <!-- =================================
                 PANEL IZQUIERDO
            ================================== -->

         <section class="brand-panel">

            <div class="brand-content">

               <div class="logo">

                  <i class="fa-solid fa-heart"></i>

               </div>


               <h1>Lencería</h1>


               <div class="line"></div>


               <p>
                  Elegancia que comienza contigo.
               </p>


               <span>
                  LUXURY COLLECTION
               </span>

            </div>

         </section>



         <!-- =================================
                 PANEL DERECHO
            ================================== -->

         <section class="form-panel">


            <!-- CONTROL DEL CAMBIO -->

            <input type="checkbox" id="toggle" class="toggle">



            <!-- =================================
                     BOTONES LOGIN / REGISTRO
                ================================== -->

            <div class="switch">


               <label for="toggle" class="tab login-tab">

                  Iniciar sesión

               </label>


               <label for="toggle" class="tab register-tab">

                  Registrarse

               </label>


               <div class="indicator"></div>

            </div>



            <!-- =================================
                     FORMULARIOS
                ================================== -->

            <div class="forms">


               <!-- ==============================
                         INICIAR SESIÓN
                    =============================== -->

               <div class="form login-form">


                  <span class="welcome">
                     BIENVENIDA
                  </span>


                  <h2>
                     Iniciar sesión
                  </h2>


                  <p class="description">
                     Accede a tu cuenta para continuar.
                  </p>


                  <form autocomplete="off">


                     <!-- CORREO -->

                     <div class="input-group">

                        <label>
                           Correo electrónico
                        </label>


                        <div class="input-box">

                           <i class="fa-regular fa-envelope"></i>


                           <input type="email" name="email" placeholder="tu@email.com" autocomplete="off" required>

                        </div>

                     </div>



                     <!-- CONTRASEÑA -->

                     <div class="input-group">


                        <div class="password-title">

                           <label>
                              Contraseña
                           </label>


                           <a href="#">
                              ¿Olvidaste tu contraseña?
                           </a>

                        </div>


                        <div class="input-box">

                           <i class="fa-solid fa-lock"></i>


                           <input type="password" name="password" placeholder="••••••••" autocomplete="new-password"
                              required>

                        </div>

                     </div>



                     <!-- RECORDAR -->

                     <label class="remember">

                        <input type="checkbox">

                        <span>
                           Recordarme
                        </span>

                     </label>



                     <!-- BOTÓN -->

                     <button type="submit" class="button">

                        Iniciar sesión

                        <i class="fa-solid fa-arrow-right"></i>

                     </button>


                  </form>


                  <!-- REDES -->

                  <div class="or">
                     o continúa con
                  </div>


                  <div class="social">

                     <button type="button">

                        <i class="fa-brands fa-google"></i>

                        Google

                     </button>


                     <button type="button">

                        <i class="fa-brands fa-instagram"></i>

                        Instagram

                     </button>

                  </div>


               </div>



               <!-- ==============================
                         REGISTRO
                    =============================== -->

               <div class="form register-form">


                  <span class="welcome">
                     BIENVENIDA
                  </span>


                  <h2>
                     Crear cuenta
                  </h2>


                  <p class="description">
                     Crea tu cuenta y descubre nuestra colección.
                  </p>


                  <form autocomplete="off">


                     <!-- NOMBRE -->

                     <div class="input-group">

                        <label>
                           Nombre completo
                        </label>


                        <div class="input-box">

                           <i class="fa-regular fa-user"></i>


                           <input type="text" name="nombre" placeholder="Tu nombre" autocomplete="off" required>

                        </div>

                     </div>



                     <!-- CORREO -->

                     <div class="input-group">

                        <label>
                           Correo electrónico
                        </label>


                        <div class="input-box">

                           <i class="fa-regular fa-envelope"></i>


                           <input type="email" name="email-registro" placeholder="tu@email.com" autocomplete="off"
                              required>

                        </div>

                     </div>



                     <!-- CONTRASEÑA -->

                     <div class="input-group">

                        <label>
                           Crear contraseña
                        </label>


                        <div class="input-box">

                           <i class="fa-solid fa-lock"></i>


                           <input type="password" name="password-registro" placeholder="••••••••"
                              autocomplete="new-password" required>

                        </div>

                     </div>



                     <!-- TERMINOS -->

                     <label class="remember">

                        <input type="checkbox" required>

                        <span>

                           Acepto los

                           <a href="#">
                              términos y condiciones
                           </a>

                        </span>

                     </label>



                     <!-- BOTÓN -->

                     <button type="submit" class="button">

                        Crear cuenta

                        <i class="fa-solid fa-arrow-right"></i>

                     </button>


                  </form>

               </div>


            </div>



            <!-- FOOTER -->

            <footer>

               © 2026 Lencería · Luxury Collection

            </footer>


         </section>


      </div>


   </main>


</body>

</html>
