<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lencería</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="Inicio-sesion.css" />
  </head>

  <body>
    <main class="container">
      <div class="login-card">
        <!-- PANEL IZQUIERDO -->
        <section class="brand-panel">
          <div class="brand-top">
            <span>Luxury collection</span>
            <span>2026</span>
          </div>

          <div class="brand-content">
            <div class="title-wrap">
              <i class="fa-solid fa-asterisk star"></i>
              <h1>Lencería</h1>
              <svg class="orbit" viewBox="0 0 300 120" aria-hidden="true">
                <ellipse cx="150" cy="60" rx="145" ry="52" />
              </svg>
            </div>
            <p>Elegancia que comienza contigo.</p>
          </div>

          <div class="brand-bottom">
            <span>Comodidad</span>
            <span>Elegancia</span>
          </div>
        </section>

        <!-- PANEL DERECHO -->
        <section class="form-panel">
          <input type="checkbox" id="toggle" class="toggle" />

          <div class="forms">
            <!-- FORM LOGIN -->
            <div class="form login-form">
              <form class="card" autocomplete="off">
                <div class="card-header">
                  <h2 class="card-title">Iniciar sesión</h2>
                  <p class="card-description">
                    Accede a tu cuenta para continuar.
                  </p>
                </div>

                <div class="card-content">
                  <div class="input-group">
                    <label for="login-email"> Correo electrónico </label>
                    <div class="input-box">
                      <i class="fa-regular fa-envelope"></i>
                      <input
                        id="login-email"
                        type="email"
                        name="email"
                        placeholder="tu@email.com"
                        autocomplete="off"
                        required
                      />
                    </div>
                  </div>

                  <div class="input-group">
                    <div class="password-title">
                      <label for="login-password"> Contraseña </label>
                      <a href="#"> ¿Olvidaste tu contraseña? </a>
                    </div>
                    <div class="input-box">
                      <i class="fa-solid fa-lock"></i>
                      <input
                        id="login-password"
                        type="password"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                      />
                    </div>
                  </div>

                  <label class="remember">
                    <input type="checkbox" />
                    <span> Recordarme </span>
                  </label>
                </div>

                <div class="card-footer">
                  <button type="submit" class="button">Iniciar sesión</button>
                  <label for="toggle" class="button button-outline">
                    Crear cuenta nueva
                  </label>
                </div>
              </form>
            </div>

            <!-- FORM REGISTRO -->
            <div class="form register-form">
              <form class="card" autocomplete="off">
                <div class="card-header">
                  <h2 class="card-title">Crear cuenta</h2>
                  <p class="card-description">
                    Crea tu cuenta y descubre nuestra colección.
                  </p>
                </div>

                <div class="card-content">
                  <div class="input-group">
                    <label for="reg-nombre"> Nombre completo </label>
                    <div class="input-box">
                      <i class="fa-regular fa-user"></i>
                      <input
                        id="reg-nombre"
                        type="text"
                        name="nombre"
                        placeholder="Tu nombre"
                        autocomplete="off"
                        required
                      />
                    </div>
                  </div>

                  <div class="input-group">
                    <label for="reg-email"> Correo electrónico </label>
                    <div class="input-box">
                      <i class="fa-regular fa-envelope"></i>
                      <input
                        id="reg-email"
                        type="email"
                        name="email-registro"
                        placeholder="tu@email.com"
                        autocomplete="off"
                        required
                      />
                    </div>
                  </div>

                  <div class="input-group">
                    <label for="reg-password"> Crear contraseña </label>
                    <div class="input-box">
                      <i class="fa-solid fa-lock"></i>
                      <input
                        id="reg-password"
                        type="password"
                        name="password-registro"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        required
                      />
                    </div>
                  </div>
                </div>

                <div class="card-footer">
                  <button type="submit" class="button">Crear cuenta</button>
                  <label for="toggle" class="button button-outline">
                    Ya tengo cuenta
                  </label>
                </div>
              </form>
            </div>
          </div>

          <footer>© 2026 Lencería · Luxury Collection</footer>
        </section>
      </div>
    </main>
  </body>
</html>
